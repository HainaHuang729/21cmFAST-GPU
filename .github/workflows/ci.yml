name: CPU CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgsl-dev libfftw3-dev gcc g++ pkg-config

      - name: Build 21cmCU CPU extension and test dependencies
        run: |
          python -m pip install --upgrade pip
          USE_CUDA=0 pip install -e .
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check --select E4,E7,E9,F,B --ignore F403,B008 src/py21cmcu examples benchmarks tests/native scripts

      - name: Verify CUDA ABI & stub parity
        run: python scripts/check_cuda_abi.py

      - name: Run CPU-safe native tests
        run: |
          pytest -v \
            tests/native/test_21cmcu_phase0.py \
            tests/native/test_21cmcu_phase3_d.py \
            tests/native/test_21cmcu_phase4_h.py \
            tests/native/test_21cmcu_phase4_i.py \
            tests/native/test_21cmcu_phase5_g.py \
            tests/native/test_21cmcu_phase6_lm.py \
            tests/native/test_21cmcu_phase7_oq.py \
            tests/native/test_21cmcu_phase8_instrument.py \
            tests/native/test_21cmcu_phase9_lightcone_viz.py \
            tests/native/test_21cmcu_phase10_cpu_opt.py \
            tests/native/test_21cmcu_phase11_batchpool_sbi.py \
            tests/native/test_21cmcu_phase12_topology.py \
            tests/native/test_21cmcu_phase13_fisher_multiprobe.py \
            tests/native/test_21cmcu_phase15_direction_p.py

  packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native C build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgsl-dev libfftw3-dev gcc g++ pkg-config

      - name: Build wheel & sdist and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          USE_CUDA=0 python -m build
          twine check dist/*

      - name: Smoke-test non-editable wheel install
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          import py21cmcu
          assert py21cmcu.__version__ == "0.9.0", py21cmcu.__version__
          assert py21cmcu.cuda_api_count() >= 47, py21cmcu.cuda_api_count()
          assert (Path(py21cmcu.__file__).parent / "py.typed").is_file()
          PY
          /tmp/wheel-venv/bin/21cmcu version --as-json
          /tmp/wheel-venv/bin/21cmcu doctor --as-json
